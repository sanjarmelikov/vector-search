[project]
name = "vector-search"
version = "0.1.0"
description = "A vector retrieval service with a from-scratch HNSW index, benchmarked on BEIR."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
embed = [
    "sentence-transformers>=3",
    "openai>=1.40",
    "tiktoken>=0.7",
    "python-dotenv>=1",
]
bench = ["faiss-cpu>=1.9", "matplotlib>=3.8"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
