name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Tests are offline and use fake embedders, so the heavy model libraries
      # (torch, sentence-transformers) aren't needed here; FAISS tests skip without faiss.
      - run: pip install -e '.[dev,service]'
      - run: pytest -q
